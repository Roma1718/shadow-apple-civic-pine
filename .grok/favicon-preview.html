<!doctype html><html><body style="margin:0;background:#888">
<canvas id="c16" width="16" height="16"></canvas>
<canvas id="c32" width="32" height="32"></canvas>
<canvas id="c64" width="64" height="64"></canvas>
<script>
const svg = "<svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 32 32\">\n  <rect width=\"32\" height=\"32\" rx=\"7\" fill=\"#1A3654\"/>\n  <path fill=\"#F3EFE6\" d=\"M22.56 8.19A10.2 10.2 0 1 0 22.56 23.81L19.6 20.29A5.6 5.6 0 1 1 19.6 11.71Z\"/>\n</svg>";
const blob = new Blob([svg], {type: "image/svg+xml"});
const url = URL.createObjectURL(blob);
const img = new Image();
img.onload = () => {
  for (const id of ["c16","c32","c64"]) {
    const c = document.getElementById(id);
    const ctx = c.getContext("2d");
    ctx.drawImage(img, 0, 0, c.width, c.height);
  }
  document.body.dataset.ready = "1";
};
img.src = url;
</script></body></html>
